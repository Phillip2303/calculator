<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <p id="display"></p>
    <div class="calculator">
      <div class="numbers">
        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>0</button>
      </div>
      <div class="operators">
        <button>÷</button>
        <button>x</button>
        <button>-</button>
        <button>+</button>
      </div>
      <div class="equals">
        <button>=</button>
      </div>
      <div class="clear">
        <button>CLEAR</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
